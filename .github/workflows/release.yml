name: Release

# Triggers on tag push matching vX.Y.Z. Builds Yoink, the installer, and uploads
# the installer to a GitHub Release for that tag.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install ffmpeg (for bundling)
        run: |
          choco install ffmpeg -y

      - name: Install deno (for bundling; JS runtime needed by yt-dlp's YouTube extractor)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build Yoink.exe
        run: |
          python build.py

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Read changelog entry for this release
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## v$([regex]::Escape($version)).*?(?=^## v|\z)"
          $match = [regex]::Match($content, $pattern)
          if ($match.Success) {
            $body = $match.Value.Trim()
          } else {
            $body = "Release $tag"
          }
          # Write to env for next step
          $body | Out-File -FilePath release_notes.md -Encoding utf8

      - name: Create GitHub Release with installer attached
        uses: softprops/action-gh-release@v2
        with:
          name: Yoink ${{ github.ref_name }}
          body_path: release_notes.md
          files: Output/YoinkSetup.exe
          draft: false
          prerelease: false
